services:
  # PostgreSQL Database with pgvector
  db:
    image: pgvector/pgvector:pg16
    container_name: ai-doc-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-ai_doc_assistant}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER:-postgres}" -d "$${POSTGRES_DB:-ai_doc_assistant}"
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Ollama Server
  ollama:
    image: ollama/ollama:latest
    container_name: ai-doc-ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

  # Automatically Download Ollama Models (nomic-embed-text for embeddings + LLM)
  ollama-pull:
    image: ollama/ollama:latest
    container_name: ai-doc-ollama-pull
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
      EMBEDDING_MODEL: "nomic-embed-text"
    depends_on:
      - ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for Ollama server..."
        until ollama list >/dev/null 2>&1; do
          sleep 2
        done

        echo "Downloading embedding model: $$EMBEDDING_MODEL..."
        ollama pull "$$EMBEDDING_MODEL"

        echo "Downloading LLM model: $$OLLAMA_MODEL..."
        ollama pull "$$OLLAMA_MODEL"

        echo "All required models download completed!"
    restart: "no"

  # Database Migrations
  migrate:
    image: ai-doc-assistant
    build: &app-build
      context: .
    container_name: ai-doc-migrate
    command: alembic upgrade head
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-admin}@db:5432/${POSTGRES_DB:-ai_doc_assistant}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # FastAPI Application
  app:
    image: ai-doc-assistant
    build: *app-build
    container_name: ai-doc-app
    ports:
      - "5000:5000"
    volumes:
      - uploads_data:/app/uploads
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-admin}@db:5432/${POSTGRES_DB:-ai_doc_assistant}
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
    depends_on:
      migrate:
        condition: service_completed_successfully
      ollama-pull:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_data:
  uploads_data:
