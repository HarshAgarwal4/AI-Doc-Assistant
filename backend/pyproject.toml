[project]
name = "backend"
version = "0.1.0"
description = "This is the fast API backend setup for an AI DOC ASSISTANT app"
readme = "README.md"
authors = [
    { name = "HarshAgarwal4", email = "agarwalh485@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "datasets>=5.2.0",
    "docling>=2.150.1",
    "fastapi>=0.162.0",
    "joblib>=1.6.0",
    "langchain>=1.4.8",
    "langchain-community==0.3.31",
    "langchain-google-genai>=4.4.2",
    "langchain-groq>=1.1.3",
    "langchain-mistralai>=1.1.6",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "langfuse>=5.2.0",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pydantic[email]>=2.14.1",
    "pymupdf>=2.1",
    "pytest>=9.2.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "ragas>=0.3.1",
    "rich>=15.0.0",
    "scikit-learn>=1.9.1",
    "sqlmodel>=0.0.48",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.16.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test"]
python_files = ["test_*.py", "tests.py"]

[tool.ruff]
extend-exclude = [
    "migrations/"
]
